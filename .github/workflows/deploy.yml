name: Deploy to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Path to ai-gateway repository on Raspberry Pi
        required: false
      service_name:
        description: systemd service to restart
        required: false
        default: "ai-gateway"
      health_url:
        description: Health endpoint URL on Raspberry Pi
        required: false
        default: "http://127.0.0.1:8000/health/ready"
      branch:
        description: Git branch to deploy
        required: false
        default: "main"
      startup_wait_seconds:
        description: Seconds to wait before health check
        required: false
        default: "5"

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
      TARGET_DIR: ${{ secrets.PI_APP_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PI_HOST:-}" ]] || { echo "Missing required secret: PI_HOST" >&2; exit 1; }
          [[ -n "${PI_USER:-}" ]] || { echo "Missing required secret: PI_USER" >&2; exit 1; }
          [[ -n "${{ secrets.PI_SSH_KEY }}" ]] || { echo "Missing required secret: PI_SSH_KEY" >&2; exit 1; }
          if [[ -z "${{ inputs.app_dir }}" ]]; then
            [[ -n "${TARGET_DIR:-}" ]] || { echo "Missing required secret: PI_APP_DIR (or provide app_dir input)" >&2; exit 1; }
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}
          log-public-key: false

      - name: Configure SSH known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Tailscale diagnostics
        shell: bash
        run: |
          set -euo pipefail
          tailscale status
          tailscale ip -4


      - name: Add Raspberry Pi host key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -H "${PI_HOST}" >> ~/.ssh/known_hosts

      - name: Compute deploy version metadata
        id: version_meta
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${{ inputs.branch }}"
          git fetch --no-tags --depth=1 origin "${branch_name}"

          full_sha="$(git rev-parse "origin/${branch_name}")"
          short_sha="${full_sha:0:12}"
          app_version="${branch_name}-${short_sha}"

          echo "full_sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Run deploy script on Raspberry Pi
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR_INPUT="${{ inputs.app_dir }}"
          if [[ -n "${TARGET_DIR_INPUT}" ]]; then
            TARGET_DIR="${TARGET_DIR_INPUT}"
          fi

          if [[ -z "${TARGET_DIR:-}" ]]; then
            echo "TARGET_DIR is required. Provide workflow input app_dir or set PI_APP_DIR secret." >&2
            exit 1
          fi

          timeout 10m ssh \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "${PI_USER}@${PI_HOST}" \
            "TARGET_DIR=$(printf %q "${TARGET_DIR}") bash -s" <<'EOF'
          set -euo pipefail
          test -d "$TARGET_DIR" || { echo "Deployment target directory is missing"; exit 1; }
          cd "$TARGET_DIR"

          test -d .git || { echo "Deployment target is not a git repository"; exit 1; }
          echo "Git deployment target verified"
          EOF

          timeout 10m ssh \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "${PI_USER}@${PI_HOST}" \
            "APP_DIR=$(printf %q "${TARGET_DIR}") \
             SERVICE_NAME=$(printf %q "${{ inputs.service_name }}") \
             HEALTH_URL=$(printf %q "${{ inputs.health_url }}") \
             BRANCH=$(printf %q "${{ inputs.branch }}") \
             STARTUP_WAIT_SECONDS=$(printf %q "${{ inputs.startup_wait_seconds }}") \
             APP_VERSION=$(printf %q "${{ steps.version_meta.outputs.app_version }}") \
             COMMIT_SHA=$(printf %q "${{ steps.version_meta.outputs.full_sha }}") \
             bash -s" < scripts/deploy.sh

      - name: Post-deploy container status
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m ssh \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "${PI_USER}@${PI_HOST}" \
            'if command -v docker >/dev/null 2>&1; then docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"; else echo "Docker is not installed; skipping container status"; fi'
